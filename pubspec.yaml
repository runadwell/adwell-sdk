name: adwell_sdk
description: Adwell SDK for Flutter. Links Apple Ads installs to subscription revenue so Adwell can manage keywords by what they earn.
version: 0.1.0
homepage: https://runadwell.com
repository: https://github.com/runadwell/adwell_sdk
issue_tracker: https://github.com/runadwell/adwell_sdk/issues
topics: [apple-ads, attribution, revenuecat, subscriptions]

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.runadwell.adwell_sdk
        pluginClass: AdwellSdkPlugin
      ios:
        pluginClass: AdwellSdkPlugin
